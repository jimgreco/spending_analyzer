name: Validate Spending release

# Publication only validates. Production activation uses the separately approved,
# image-pinned DB cutover in consolidated-deploy; no production credentials here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spending-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Python and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: spending_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spending_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: pip install -r webapp/requirements.txt PyYAML==6.0.2
      - name: Validate publication controls
        run: python -m unittest discover -s tests -v
      - name: Test with an isolated synthetic database
        env:
          SPENDING_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/spending_release_test
        run: python -m unittest discover -s webapp -p 'test_*.py' -v

  image:
    name: Production image build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build without publishing
        run: |
          test "$(uname -m)" = aarch64
          docker build --platform linux/arm64 -t spending-validation:${{ github.sha }} webapp
          test "$(docker image inspect --format '{{.Architecture}}' spending-validation:${{ github.sha }})" = arm64

  required:
    name: Required Checks
    if: always()
    needs: [tests, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: test "$TESTS_RESULT" = success && test "$IMAGE_RESULT" = success
