name: Retired automatic deployment

# Keep the old workflow ID harmless, including if somebody re-enables it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse implicit activation
        run: |
          echo '::error::This deployment path is retired. Run validation in ci.yml and use the separately approved image-pinned cutover procedure.'
          exit 1
