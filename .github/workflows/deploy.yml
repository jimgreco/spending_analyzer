name: Deploy Spending

# Every push to main deploys after the full validation workflow passes. Pull
# requests never run this file; ci.yml (secret-free) validates them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spending-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PUBLIC_URL: https://spending-analyzer.jim-greco.com
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret $name (add it to the production environment)"
              missing=1
            fi
          done
          test "$missing" = 0
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Unexpected commit SHA format'; exit 1; }

      - name: Prepare SSH with pinned host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/spending-ssh"
          mkdir -p "$dir"
          printf '%s\n' "$EC2_SSH_KEY" > "$dir/key"
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null 2>&1 || {
            echo '::error::EC2_SSH_KEY cannot be parsed as an unencrypted SSH private key.'
            exit 1
          }
          {
            echo 'Host production'
            echo "  HostName $EC2_HOST"
            echo "  User $EC2_USER"
            echo "  IdentityFile $dir/key"
            echo '  IdentitiesOnly yes'
            echo "  UserKnownHostsFile $dir/known_hosts"
            echo '  StrictHostKeyChecking yes'
            echo '  BatchMode yes'
          } > "$dir/config"
          echo "SSH_CONFIG=$dir/config" >> "$GITHUB_ENV"

      - name: Bake version metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          sha = os.environ["GITHUB_SHA"]
          timestamp = subprocess.check_output(["git", "log", "-1", "--format=%ci", sha], text=True).strip()
          version = open("webapp/VERSION").read().strip()
          with open("webapp/version.json", "w") as file:
              json.dump({"sha": sha[:7], "timestamp": timestamp, "version": version}, file)
              file.write("\n")
          PY

      - name: Transfer release helper and run read-only preflight
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" production 'mkdir -p "$HOME/spending/scripts" "$HOME/spending/webapp"'
          rsync -rtz --chmod=F755 -e "ssh -F $SSH_CONFIG" scripts/deploy-service.py \
            production:spending/scripts/deploy-service.py
          ssh -F "$SSH_CONFIG" production 'python3 "$HOME/spending/scripts/deploy-service.py"'

      - name: Transfer webapp source
        run: |
          set -euo pipefail
          rsync -rtz --delete -e "ssh -F $SSH_CONFIG" \
            --exclude '.env*' --exclude 'venv/' --exclude '.venv/' \
            --exclude '__pycache__/' --exclude '.elasticbeanstalk/' \
            webapp/ production:spending/webapp/

      - name: Rebuild and replace only Spending
        run: |
          set -euo pipefail
          # GITHUB_SHA was validated as 40 lowercase hex characters above.
          # shellcheck disable=SC2029
          ssh -F "$SSH_CONFIG" production \
            "python3 \"\$HOME/spending/scripts/deploy-service.py\" --release '$GITHUB_SHA'"

      - name: Smoke check public version
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA::7}"
          for _ in $(seq 1 30); do
            actual=$(curl -fsS --max-time 10 "$PUBLIC_URL/api/version" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))' || true)
            if [ "$actual" = "$expected" ]; then
              echo "Production reports $actual"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PUBLIC_URL/api/version did not report $expected"
          exit 1

      - name: Remove SSH key material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/spending-ssh"
